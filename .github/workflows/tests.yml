name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system libraries (gramps.gen.lib needs GObject introspection at import time)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository-2.0-dev \
            gir1.2-glib-2.0 \
            libcairo2-dev \
            pkg-config

      - name: Install package
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest -v
